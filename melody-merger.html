<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melody Merger</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#1c2b39;--sub:#5b6b7a;--line:#d5dde4;--a:#0e7c86;--b:#c26a00;--main:#2a4fd6;--err:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.55}
main{max-width:940px;margin:0 auto;padding:26px 18px 60px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
.lead{color:var(--sub);margin:0 0 20px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.slots{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.slot{border-top:6px solid var(--line)}
.slot[data-k="0"]{border-top-color:var(--a)}
.slot[data-k="1"]{border-top-color:var(--b)}
h2{font-size:16px;margin:0 0 8px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:14px 10px;text-align:center;color:var(--sub);cursor:pointer;font-size:14px}
.drop:hover,.drop:focus-visible,.drop.over{border-color:var(--main);background:#eef2ff;outline:none}
.info{font-size:13px;color:var(--sub);margin:8px 0 4px;word-break:break-all}
.wfwrap{position:relative}
canvas.wf{width:100%;height:76px;display:block;background:#f7f9fb;border-radius:6px;touch-action:none;cursor:ew-resize}
.ph{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:#e11d48;pointer-events:none;display:none}
.rng{font-size:13px;margin:6px 0 0;min-height:20px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px}
button.sm{padding:3px 8px;font-size:13px}
button:hover:not(:disabled){border-color:var(--main)}
button:focus-visible{outline:3px solid #9db0ff;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--main);border-color:var(--main);color:#fff;font-weight:600}
button.add0{border-color:var(--a);color:var(--a);font-weight:600}
button.add1{border-color:var(--b);color:var(--b);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.panel{margin-top:14px}
#line{display:flex;flex-wrap:wrap;gap:8px;min-height:74px;padding:10px;background:#f7f9fb;border:1px dashed var(--line);border-radius:8px;align-items:stretch}
.empty{color:var(--sub);font-size:14px;align-self:center}
.chip{border-radius:8px;color:#fff;padding:6px 8px;min-width:128px}
.chip.k0{background:var(--a)}.chip.k1{background:var(--b)}
.chip.now{box-shadow:0 0 0 4px #ffd84d}
.chip b{display:block;font-size:15px}
.chip small{display:block;opacity:.92;font-size:12px}
.chip .ctl{display:flex;gap:4px;margin-top:5px}
.chip .ctl button{padding:1px 7px;font-size:13px;background:rgba(255,255,255,.92);border-color:transparent;color:var(--ink)}
.bar{height:6px;background:#e3e9ee;border-radius:3px;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--main);border-radius:3px}
.sum{font-size:15px;margin:10px 0 0}
textarea{font:inherit;width:100%;min-height:76px;padding:8px;border:1px solid var(--line);border-radius:6px;resize:vertical}
input[type=text]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;width:170px}
label.l{font-size:14px;color:var(--sub)}
#msg{min-height:22px;margin-top:8px;font-size:14px}
#msg.err{color:var(--err)}
.hidden{display:none}
.hint{font-size:13px;color:var(--sub);margin-top:14px}
</style>
</head>
<body>
<main>
<h1>Melody Merger</h1>
<p class="lead">A, B 두 음원을 올리고 필요한 구간만 골라 원하는 순서와 횟수로 배치해 나만의 곡을 만들어 보세요. 파일은 이 기기 안에서만 처리됩니다.</p>

<div class="slots" id="slots"></div>

<section class="card panel">
  <h2>곡 구성</h2>
  <div class="row" style="margin:0 0 10px">
    <button class="add0" id="add0" disabled>+ A 넣기</button>
    <button class="add1" id="add1" disabled>+ B 넣기</button>
    <button id="clear" disabled>모두 지우기</button>
    <span style="font-size:13px;color:var(--sub)">위에서 고른 구간이 그대로 들어갑니다.</span>
  </div>
  <div id="line" aria-label="곡 구성 순서"></div>
  <div class="bar"><i id="fill"></i></div>
  <p class="sum" id="sum"></p>
  <div class="row"><button id="pvAll" disabled>구성 전체 듣기</button><button id="pzAll" disabled>일시정지</button><button id="stAll" disabled>정지</button></div>
</section>

<section class="card panel">
  <h2>구성 이유</h2>
  <textarea id="why" placeholder="이렇게 구성한 이유를 음악 요소(토리, 장단, 분위기, 셈여림 등)를 들어 적어 보세요."></textarea>
  <div class="row">
    <label class="l" for="who">학번·이름</label><input id="who" type="text" maxlength="20" placeholder="예: 20305 홍길동">
    <button id="copy" disabled>구성 기록 복사</button>
    <button id="dl" class="primary" disabled>WAV 파일로 저장</button>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
</section>

<p class="hint">두 음원의 장단과 빠르기(BPM)가 같아야 이어 붙였을 때 박이 어긋나지 않습니다. 음원을 들으면서 빨간 재생 위치선을 보고, 파형의 손잡이를 끌어 구간을 정하세요.</p>
</main>

<script>
(function(){
  var SR = 44100, MAXB = 16, MINLEN = 0.1, NP = 1200;
  var ctx = null, master = null, P = null, raf = 0;
  var clips = [null, null], rng = [null, null], peaks = [null, null], blocks = [];
  var $ = function(s, r){ return (r||document).querySelector(s); };
  var msg = $('#msg'), COLORS = ['#0e7c86', '#c26a00'], NAMES = ['A', 'B'];
  var slotEl = [];

  // ---- 화면 만들기 ----
  [0, 1].forEach(function(k){
    var el = document.createElement('section'); el.className = 'card slot'; el.dataset.k = k;
    el.innerHTML = '<h2>' + NAMES[k] + ' 음원</h2>' +
      '<div class="drop" tabindex="0" role="button" aria-label="' + NAMES[k] + ' 음원 파일 선택">파일을 끌어 놓거나 눌러서 선택<br><small>wav, mp3, m4a</small></div>' +
      '<input type="file" accept="audio/*" class="hidden"><div class="info">아직 파일이 없습니다.</div>' +
      '<div class="wfwrap"><canvas class="wf" aria-label="' + NAMES[k] + ' 음원 구간 선택"></canvas><div class="ph"></div></div><div class="rng"></div>' +
      '<div class="row"><button class="pa">전체 듣기</button><button class="pv">선택 구간 듣기</button><button class="pz">일시정지</button><button class="st">정지</button></div>' +
      '<div class="row"><button class="trim sm">끝 여백 자동 자르기</button><button class="reset sm">전체 구간</button></div>';
    $('#slots').appendChild(el); slotEl.push(el);
  });

  function getCtx(){
    if(!ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      try { ctx = new AC({latencyHint: 'playback'}); } catch(e){ ctx = new AC(); }
      SR = ctx.sampleRate;
      master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
    }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function say(t, err){ msg.textContent = t || ''; msg.className = err ? 'err' : ''; }
  function fmt(s){ var m = Math.floor(s/60); return (m ? m + '분 ' : '') + (s%60).toFixed(1) + '초'; }
  function f1(x){ return x.toFixed(1); }

  // ---- 파일 불러오기 ----
  slotEl.forEach(function(el, k){
    var drop = $('.drop', el), input = $('input', el);
    drop.addEventListener('click', function(){ input.click(); });
    drop.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); input.click(); } });
    drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', function(){ drop.classList.remove('over'); });
    drop.addEventListener('drop', function(e){ e.preventDefault(); drop.classList.remove('over'); if(e.dataTransfer.files[0]) load(k, e.dataTransfer.files[0]); });
    input.addEventListener('change', function(){ if(input.files[0]) load(k, input.files[0]); });
    $('.pa', el).addEventListener('click', function(){ start('clip', k, slice(k, 0, clips[k].dur), 0); });
    $('.pv', el).addEventListener('click', function(){ start('clip', k, slice(k, rng[k].s, rng[k].e), rng[k].s); });
    $('.pz', el).addEventListener('click', function(){ pauseToggle('clip', k); });
    $('.st', el).addEventListener('click', stop);
    $('.trim', el).addEventListener('click', function(){ autoTrim(k); });
    $('.reset', el).addEventListener('click', function(){ rng[k] = {s:0, e:clips[k].dur}; paint(k); });
    handles(k);
  });

  function load(k, file){
    stop(); say('음원을 읽는 중입니다…');
    var fr = new FileReader();
    fr.onerror = function(){ say('파일을 읽지 못했습니다. 다시 선택해 주세요.', true); };
    fr.onload = function(){
      getCtx().decodeAudioData(fr.result, function(buf){
        var L = buf.getChannelData(0).slice();
        var R = buf.numberOfChannels > 1 ? buf.getChannelData(1).slice() : L.slice();
        if(clips[k]){ blocks = blocks.filter(function(b){ return b.k !== k; }); }
        clips[k] = { name: file.name, data: [L, R], dur: buf.length / buf.sampleRate };
        rng[k] = { s: 0, e: clips[k].dur };
        var pk = new Float32Array(NP), step = L.length / NP;
        for(var p=0;p<NP;p++){
          var a = Math.floor(p*step), b = Math.min(L.length, Math.floor((p+1)*step)+1), m = 0;
          for(var i=a;i<b;i+=Math.max(1,Math.floor((b-a)/24))){ var v = Math.max(Math.abs(L[i]), Math.abs(R[i])); if(v>m) m = v; }
          pk[p] = Math.min(1, m);
        }
        peaks[k] = pk;
        $('.info', slotEl[k]).textContent = file.name + ' · ' + fmt(clips[k].dur);
        say(''); paint(k); render();
      }, function(){ say('이 파일은 읽을 수 없습니다. wav, mp3, m4a 파일인지 확인해 주세요.', true); });
    };
    fr.readAsArrayBuffer(file);
  }

  // ---- 구간 선택 ----
  function move(k, h, t){
    var d = clips[k].dur, r = rng[k];
    t = Math.max(0, Math.min(d, t));
    if(h === 's') r.s = Math.min(t, r.e - MINLEN); else r.e = Math.max(t, r.s + MINLEN);
    r.s = Math.max(0, r.s); r.e = Math.min(d, r.e);
  }
  function paint(k){
    var c = $('canvas', slotEl[k]), pk = peaks[k];
    var dpr = window.devicePixelRatio || 1, w = c.width = c.clientWidth * dpr, h = c.height = 76 * dpr;
    var g = c.getContext('2d'); g.clearRect(0,0,w,h);
    if(!pk) return;
    g.fillStyle = COLORS[k];
    for(var x=0;x<w;x++){ var bh = Math.max(1, pk[Math.min(NP-1, Math.floor(x/w*NP))]*h*0.9); g.fillRect(x, (h-bh)/2, 1, bh); }
    var d = clips[k].dur, xs = rng[k].s/d*w, xe = rng[k].e/d*w;
    g.fillStyle = 'rgba(247,249,251,.82)'; g.fillRect(0,0,xs,h); g.fillRect(xe,0,w-xe,h);
    g.fillStyle = '#1c2b39'; g.fillRect(xs-dpr,0,2*dpr,h); g.fillRect(xe-dpr,0,2*dpr,h);
    g.fillRect(xs-dpr,0,9*dpr,9*dpr); g.fillRect(xe-8*dpr,h-9*dpr,9*dpr,9*dpr);
    $('.rng', slotEl[k]).textContent = '선택 구간 ' + f1(rng[k].s) + '초 ~ ' + f1(rng[k].e) + '초 (길이 ' + f1(rng[k].e - rng[k].s) + '초)';
    ui();
  }
  function handles(k){
    var c = $('canvas', slotEl[k]), drag = null;
    function tOf(e){ var b = c.getBoundingClientRect(); return {t: (e.clientX - b.left)/b.width*clips[k].dur, px: b.width/clips[k].dur}; }
    c.addEventListener('pointerdown', function(e){
      if(!clips[k]) return;
      var o = tOf(e), r = rng[k], ds = Math.abs(o.t - r.s)*o.px, de = Math.abs(o.t - r.e)*o.px;
      drag = (ds < 14 || de < 14) ? (ds <= de ? 's' : 'e') : (Math.abs(o.t - r.s) < Math.abs(o.t - r.e) ? 's' : 'e');
      c.setPointerCapture(e.pointerId); move(k, drag, o.t); paint(k);
    });
    c.addEventListener('pointermove', function(e){ if(drag){ move(k, drag, tOf(e).t); paint(k); } });
    function up(){ drag = null; }
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  }
  function autoTrim(k){
    var L = clips[k].data[0], R = clips[k].data[1], peak = 0, i;
    for(i=0;i<L.length;i+=8){ var v = Math.max(Math.abs(L[i]), Math.abs(R[i])); if(v > peak) peak = v; }
    var thr = Math.max(0.01, peak*0.03), win = Math.round(SR*0.01), end = L.length;
    for(var p=L.length-win; p>=0; p-=win){
      var m = 0;
      for(i=p;i<p+win;i++){ var q = Math.max(Math.abs(L[i]), Math.abs(R[i])); if(q > m) m = q; }
      if(m > thr){ end = p + win; break; }
    }
    var e = Math.min(clips[k].dur, end/SR + 0.05), cut = clips[k].dur - e;
    if(cut < 0.05){ say('자를 끝 여백이 거의 없습니다.'); return; }
    rng[k].e = Math.max(e, rng[k].s + MINLEN); paint(k);
    say('끝 여백 ' + f1(cut) + '초를 잘랐습니다. 박이 맞는지 이음새를 들어 보고, 필요하면 끝 손잡이로 조정하세요.');
  }

  // ---- 구성 편집 ----
  function stopAll(){ if(P && P.kind === 'all') stop(); }
  function add(k){
    if(blocks.length >= MAXB){ say('최대 ' + MAXB + '개까지 넣을 수 있습니다.', true); return; }
    stopAll(); blocks.push({k:k, s:rng[k].s, e:rng[k].e}); say(''); render();
  }
  $('#add0').addEventListener('click', function(){ add(0); });
  $('#add1').addEventListener('click', function(){ add(1); });
  $('#clear').addEventListener('click', function(){ stopAll(); blocks = []; render(); });

  function render(){
    var line = $('#line'); line.innerHTML = '';
    if(!blocks.length){
      line.innerHTML = '<span class="empty">위에서 구간을 고르고 버튼을 누르면 여기에 순서대로 쌓입니다. 같은 음원이나 다른 구간을 여러 번 넣어도 됩니다.</span>';
    }
    blocks.forEach(function(b, i){
      var part = b.s > 0.005 || b.e < clips[b.k].dur - 0.005;
      var d = document.createElement('div'); d.className = 'chip k' + b.k;
      d.innerHTML = '<b>' + (i+1) + '. ' + NAMES[b.k] + '</b><small>' + f1(b.s) + '~' + f1(b.e) + '초 · ' + f1(b.e-b.s) + '초' + (part ? ' (일부)' : '') + '</small><div class="ctl"></div>';
      var ctl = $('.ctl', d);
      [['◀','앞으로',function(){ swap(i,i-1); }, i===0],
       ['▶','뒤로',function(){ swap(i,i+1); }, i===blocks.length-1],
       ['복제','복제',function(){ dup(i); }, false],
       ['✕','삭제',function(){ stopAll(); blocks.splice(i,1); render(); }, false]].forEach(function(x){
        var bt = document.createElement('button'); bt.textContent = x[0]; bt.title = x[1];
        bt.setAttribute('aria-label', (i+1) + '번 ' + x[1]); bt.disabled = x[3]; bt.addEventListener('click', x[2]); ctl.appendChild(bt);
      });
      line.appendChild(d);
    });
    var has = blocks.length > 0, total = 0;
    blocks.forEach(function(b){ total += b.e - b.s; });
    $('#sum').textContent = has ? '구성: ' + blocks.map(function(b){ return NAMES[b.k]; }).join(' → ') + '  ·  총 ' + fmt(total) : '';
    $('#clear').disabled = $('#dl').disabled = $('#copy').disabled = !has;
    ui();
  }
  function swap(a, b){ stopAll(); var t = blocks[a]; blocks[a] = blocks[b]; blocks[b] = t; render(); }
  function dup(i){
    if(blocks.length >= MAXB){ say('최대 ' + MAXB + '개까지 넣을 수 있습니다.', true); return; }
    stopAll(); blocks.splice(i+1, 0, {k:blocks[i].k, s:blocks[i].s, e:blocks[i].e}); render();
  }

  // ---- 소리 만들기 ----
  function slice(k, s, e){
    var a = Math.round(s*SR), b = Math.min(clips[k].data[0].length, Math.round(e*SR)), n = Math.max(1, b - a);
    var out = [clips[k].data[0].slice(a, a+n), clips[k].data[1].slice(a, a+n)];
    var fo = Math.min(n>>1, Math.round(SR*0.005)), fi = s > 0.001 ? Math.min(n>>1, Math.round(SR*0.003)) : 0, i;
    out.forEach(function(ch){
      for(i=0;i<fi;i++) ch[i] *= i/fi;
      for(i=0;i<fo;i++) ch[n-1-i] *= i/fo;
    });
    return out;
  }
  function build(){
    var parts = blocks.map(function(b){ return slice(b.k, b.s, b.e); }), n = 0, o = 0;
    parts.forEach(function(p){ n += p[0].length; });
    var L = new Float32Array(n), R = new Float32Array(n);
    parts.forEach(function(p){ L.set(p[0], o); R.set(p[1], o); o += p[0].length; });
    return [L, R];
  }

  // ---- 재생 (재생 위치 표시·일시정지) ----
  function pos(){ return P ? Math.max(0, Math.min(P.dur, ctx.currentTime - P.t0)) : 0; }
  function ph(k, t){
    var el = $('.ph', slotEl[k]);
    if(t == null || !clips[k]){ el.style.display = 'none'; return; }
    el.style.display = 'block'; el.style.left = (t / clips[k].dur * 100) + '%';
  }
  function start(kind, k, data, base){
    stop();
    var c = getCtx(), buf = c.createBuffer(2, data[0].length, c.sampleRate);
    buf.copyToChannel(data[0], 0); buf.copyToChannel(data[1], 1);
    var src = c.createBufferSource(); src.buffer = buf; src.connect(master);
    var t0 = c.currentTime + 0.05; src.start(t0);
    P = { src: src, kind: kind, k: k, base: base, t0: t0, dur: buf.duration, paused: false };
    src.onended = function(){ if(P && P.src === src) stop(); };
    ui(); tick();
  }
  function tick(){
    if(!P) return;
    var t = pos();
    if(P.kind === 'clip'){ ph(P.k, P.base + t); ph(1 - P.k, null); }
    else {
      var acc = 0, idx = -1, rel = 0;
      for(var i=0;i<blocks.length;i++){ var l = blocks[i].e - blocks[i].s; if(t < acc + l){ idx = i; rel = t - acc; break; } acc += l; }
      document.querySelectorAll('.chip').forEach(function(ch, i){ ch.classList.toggle('now', i === idx); });
      if(idx >= 0){ ph(blocks[idx].k, blocks[idx].s + rel); ph(1 - blocks[idx].k, null); }
      $('#fill').style.width = (t / P.dur * 100) + '%';
    }
    raf = requestAnimationFrame(tick);
  }
  function pauseToggle(kind, k){
    if(!P || P.kind !== kind || (kind === 'clip' && P.k !== k)) return;
    if(P.paused) ctx.resume(); else ctx.suspend();
    P.paused = !P.paused; ui();
  }
  function stop(){
    cancelAnimationFrame(raf);
    if(P){ try{ P.src.onended = null; P.src.stop(); }catch(e){} }
    P = null;
    if(ctx && ctx.state === 'suspended') ctx.resume();
    ph(0, null); ph(1, null);
    document.querySelectorAll('.chip.now').forEach(function(c){ c.classList.remove('now'); });
    $('#fill').style.width = '0';
    ui();
  }
  function ui(){
    slotEl.forEach(function(el, k){
      var en = !!clips[k], mine = !!(P && P.kind === 'clip' && P.k === k);
      ['.pa','.pv','.trim','.reset'].forEach(function(s){ $(s, el).disabled = !en; });
      $('.pz', el).disabled = $('.st', el).disabled = !mine;
      $('.pz', el).textContent = (mine && P.paused) ? '계속 재생' : '일시정지';
      $('#add' + k).disabled = !en;
    });
    var all = !!(P && P.kind === 'all');
    $('#pvAll').disabled = !blocks.length;
    $('#pzAll').disabled = $('#stAll').disabled = !all;
    $('#pzAll').textContent = (all && P.paused) ? '계속 재생' : '일시정지';
  }
  $('#pvAll').addEventListener('click', function(){ if(blocks.length) start('all', 0, build(), 0); });
  $('#pzAll').addEventListener('click', function(){ pauseToggle('all'); });
  $('#stAll').addEventListener('click', stop);

  // ---- 기록 복사 · WAV 저장 ----
  function record(){
    var total = 0; blocks.forEach(function(b){ total += b.e - b.s; });
    return '[' + ($('#who').value.trim() || '이름 미입력') + ']\n구성: ' +
      blocks.map(function(b){ return NAMES[b.k] + '(' + f1(b.s) + '~' + f1(b.e) + '초)'; }).join(' → ') +
      ' (총 ' + fmt(total) + ')\n구성 이유: ' + ($('#why').value.trim() || '(미작성)');
  }
  $('#copy').addEventListener('click', function(){
    var t = record();
    function ok(){ say('구성 기록을 복사했습니다. 제출 양식에 붙여 넣으세요.'); }
    function fallback(){ var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){ say('복사하지 못했습니다. 직접 선택해서 복사해 주세요.', true); } ta.remove(); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(ok, fallback); } else fallback();
  });

  function toWav(L, R){
    var n = L.length, buf = new ArrayBuffer(44 + n*4), v = new DataView(buf);
    function str(o, s){ for(var i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); }
    str(0,'RIFF'); v.setUint32(4,36+n*4,true); str(8,'WAVE'); str(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,2,true);
    v.setUint32(24,SR,true); v.setUint32(28,SR*4,true); v.setUint16(32,4,true); v.setUint16(34,16,true);
    str(36,'data'); v.setUint32(40,n*4,true);
    var o = 44;
    for(var i=0;i<n;i++){
      var l = Math.max(-1,Math.min(1,L[i])), r = Math.max(-1,Math.min(1,R[i]));
      v.setInt16(o, l<0 ? l*0x8000 : l*0x7FFF, true); o+=2;
      v.setInt16(o, r<0 ? r*0x8000 : r*0x7FFF, true); o+=2;
    }
    return new Blob([buf], {type:'audio/wav'});
  }
  $('#dl').addEventListener('click', function(){
    var d = build(), who = $('#who').value.replace(/[\\/:*?"<>|]/g,'_').trim();
    var name = (who ? who + '_' : '') + 'MelodyMerger';
    var url = URL.createObjectURL(toWav(d[0], d[1]));
    var a = document.createElement('a'); a.href = url; a.download = name + '.wav';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    say('"' + name + '.wav" 파일로 저장했습니다. 다운로드 폴더를 확인하세요.');
  });

  window.addEventListener('resize', function(){ [0,1].forEach(function(k){ if(clips[k]) paint(k); }); });
  render();
})();
</script>
</body>
</html>
